#
# Generated by `pushforge pipeline`. This is a safe starting point — tighten
# the checks as your project grows (see the CI section of the README).
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${ github.workflow }-${ github.ref }
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Generic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q .
        continue-on-error: true
